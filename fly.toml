# Fly.io settings for the hosted Wardy Agent. One small machine, always on, with a 1 GB volume for owners' data.
# The app name must be unique on Fly.io: if it's taken, `fly launch` offers to change it.
app = "wardy-agent"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  WARDY_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so a judge never waits for a cold start, and the cost is the same every month.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "wardy_agent_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
