name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run attack-lab -- --offline
      # The committed results must be exactly what a fresh run produces, so every published number is real.
      - name: Committed Attack Lab results match this run
        run: git diff --exit-code -- apps/attack-lab/results
      - name: Every verdict in the results is signed and chained
        run: npm run verify-audit -- apps/attack-lab/results/audit.jsonl
      # The chain isn't asked here, so an RPC outage can't fail CI. Without --offline, the same command asks it too.
      - name: The anchored Wardy Network feed verifies
        run: npm run network:verify -- --offline
      - name: The demo prints its summary with no keys
        run: |
          npm run demo -- --offline | tee demo-output.txt
          grep -E "Lost with Wardy Agent: 0 · Honest payments passed: ([0-9]+)/\1 · False blocks: 0" demo-output.txt
      - run: npm run walkthrough
      - run: npm run build:web
      # A real browser, using the real dashboard. Unit tests can't see a hang or a page wider than a phone.
      - run: npm run test:ui

  # The hosted server, built the way Fly.io builds it, then asked for its health, its dashboard and a sandbox.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t wardy-agent .
      - run: docker run -d --name wardy -p 8080:8080 wardy-agent
      - name: The container answers
        run: |
          for attempt in $(seq 1 60); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/health | grep '"hosted":true'
          curl -fs -H "accept: text/html" http://127.0.0.1:8080/ | grep -i "<!doctype html>"
          curl -fs -X POST http://127.0.0.1:8080/v1/sandbox | grep ownerToken
      - name: It refuses a mainnet setting
        run: |
          if docker run --rm -e WARDY_GRANT_TOKEN=x wardy-agent; then echo "started with a mainnet setting"; exit 1; fi
      - if: failure()
        run: docker logs wardy

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/registry
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
